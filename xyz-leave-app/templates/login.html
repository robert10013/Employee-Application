{% extends "base.html" %}{% block content %}
<div class="row justify-content-center"><div class="col-md-4"><div class="card shadow-sm"><div class="card-body">
  <h4 class="mb-3">Login</h4>
  <form method="post">
    <input class="form-control mb-2" name="username" placeholder="Username" required autofocus>
    <input class="form-control mb-3" type="password" name="password" placeholder="Password" required>
    <button class="btn btn-primary w-100">Login</button>
  </form>
  <small class="text-muted d-block mt-3">Demo: admin/admin123 · user1/user123 · user2/user123</small>
</div></div></div></div>{% endblock %}
